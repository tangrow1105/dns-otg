# Builds the signed Android App Bundle (.aab) for Google Play. It is kept as a workflow artifact
# (Actions run page, Artifacts) and in a draft release that only repo owners can see, never public.
name: Play bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "DNSOTG_KEYSTORE_PROPS=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Build bundle
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Check it is signed with the release key
        run: |
          jarsigner -verify -verbose:summary -certs app/build/outputs/bundle/release/app-release.aab | tee certs.txt
          grep -q "jar verified" certs.txt
          if grep -q "Android Debug" certs.txt; then echo "::error::Signed with the debug key"; exit 1; fi

      - name: Name it
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          mkdir out && cp app/build/outputs/bundle/release/app-release.aab "out/DNS-OTG-$version-$code.aab"
          echo "version=$version" >> "$GITHUB_ENV"; echo "code=$code" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: out/*.aab
          retention-days: 30

      - name: Save to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="play-$code"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/*.aab --draft --target "$GITHUB_SHA" \
            --title "Play bundle $version ($code)" --notes "Signed bundle for Google Play. Draft only: not for public download."

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.properties"
